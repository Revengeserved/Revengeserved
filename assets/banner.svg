<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="55%" stop-color="#07070b"/>
      <stop offset="100%" stop-color="#020204"/>
    </radialGradient>
    <linearGradient id="neonLine" x1="0" y1="0" x2="1280" y2="0">
      <stop offset="0%" stop-color="#0FE9EF" stop-opacity="0"/>
      <stop offset="25%" stop-color="#0FE9EF"/>
      <stop offset="50%" stop-color="#F008BB"/>
      <stop offset="75%" stop-color="#0FE9EF"/>
      <stop offset="100%" stop-color="#F008BB" stop-opacity="0"/>
    </linearGradient>
    <filter id="pinkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="blueGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softSmoke" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="7"/>
      <feColorMatrix type="matrix" values="1 0 0 0 0.8  0 1 0 0 0.8  0 0 1 0 1  0 0 0 0.22 0"/>
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1280" height="420" fill="url(#bgGlow)"/>
  <rect width="1280" height="420" fill="#000" opacity="0.28"/>

