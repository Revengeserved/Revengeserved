  <text x="640" y="174" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#0FE9EF" filter="url(#blueGlow)" letter-spacing="1">JAKOB • RONN POPAGORGIO</text>
